<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --bg2: #161616;
    --bg3: #1f1f1f;
    --border: #2a2a2a;
    --border2: #333;
    --text: #f0f0f0;
    --text2: #a0a0a0;
    --text3: #5a5a5a;
    --white: #ffffff;
    --accent: #ffffff;
    --red: #ff4444;
    --yellow: #f5c842;
    --green: #3ecf8e;
    --blue: #60a5fa;
    --radius: 10px;
    --radius-sm: 7px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* When used as a webpage, center it nicely */
  body {
    background: #080808;
    font-family: 'Outfit', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px;
  }

  .app {
    background: var(--bg);
    width: 100%;
    max-width: 420px;
    min-height: 580px;
    border-radius: 16px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7);
  }

  /* Top Bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Outfit', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .logo-dot {
    width: 8px; height: 8px;
    background: var(--white);
    border-radius: 50%;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text3);
    letter-spacing: 0.5px;
  }

  .icon-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text3);
    cursor: pointer;
    padding: 5px 8px;
    font-size: 0.75rem;
    transition: all 0.15s;
    line-height: 1;
  }
  .icon-btn:hover { border-color: var(--border2); color: var(--text); }

  /* Tab Bar */
  .tabbar {
    display: flex;
    padding: 10px 12px 0;
    gap: 4px;
    flex-shrink: 0;
  }

  .tab {
    background: none;
    border: none;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    color: var(--text3);
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 7px 12px;
    transition: all 0.15s;
    border-bottom: 2px solid transparent;
  }

  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--white); border-bottom-color: var(--white); }

  /* Views */
  .view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  .view.active { display: flex; }

  /* Quick Add */
  .quick-add {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .quick-row {
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    transition: border-color 0.15s;
  }

  .quick-row:focus-within { border-color: var(--border2); }

  .quick-row input {
    background: none;
    border: none;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 0.88rem;
    flex: 1;
    outline: none;
  }

  .quick-row input::placeholder { color: var(--text3); }

  .add-trigger {
    background: var(--white);
    border: none;
    border-radius: 5px;
    color: #000;
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 5px 10px;
    transition: opacity 0.15s;
    white-space: nowrap;
  }

  .add-trigger:hover { opacity: 0.85; }

  /* Expand Form */
  .expand-form {
    display: none;
    padding: 0 14px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .expand-form.open { display: block; }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }

  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-field.full { grid-column: 1 / -1; }

  .form-field label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text3);
  }

  .form-field input,
  .form-field select,
  .form-field textarea {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 0.82rem;
    padding: 7px 10px;
    outline: none;
    transition: border-color 0.15s;
  }

  .form-field input:focus,
  .form-field select:focus,
  .form-field textarea:focus { border-color: var(--border2); }

  .form-field select option { background: var(--bg2); }
  .form-field textarea { resize: none; height: 56px; }

  .form-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .btn-primary {
    background: var(--white);
    border: none;
    border-radius: 6px;
    color: #000;
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 8px 16px;
    flex: 1;
    transition: opacity 0.15s;
  }

  .btn-primary:hover { opacity: 0.88; }

  .btn-secondary {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text3);
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    font-size: 0.82rem;
    padding: 8px 12px;
    transition: all 0.15s;
  }

  .btn-secondary:hover { border-color: var(--border2); color: var(--text); }

  /* Filter Row */
  .filter-row {
    display: flex;
    gap: 6px;
    padding: 10px 14px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
  }

  .filter-row::-webkit-scrollbar { display: none; }

  .chip {
    background: none;
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text3);
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    padding: 4px 11px;
    white-space: nowrap;
    transition: all 0.15s;
  }

  .chip:hover { border-color: var(--border2); color: var(--text2); }
  .chip.active { background: var(--white); border-color: var(--white); color: #000; }

  /* Task scroll area */
  .task-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 6px 10px 10px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .task-scroll::-webkit-scrollbar { width: 4px; }
  .task-scroll::-webkit-scrollbar-track { background: transparent; }
  .task-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--text3);
    font-size: 0.82rem;
    line-height: 2;
  }

  .empty .e-icon { font-size: 2rem; margin-bottom: 10px; opacity: 0.4; display: block; }

  /* Task Card */
  .task-card {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    margin-bottom: 4px;
    transition: all 0.15s;
    cursor: default;
    position: relative;
    background: var(--bg2);
    animation: fadeSlide 0.2s ease;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .task-card:hover { border-color: var(--border); background: var(--bg3); }
  .task-card.done { opacity: 0.45; }

  /* Priority left stripe */
  .task-card::before {
    content: '';
    position: absolute;
    left: 0; top: 8px; bottom: 8px;
    width: 2px;
    border-radius: 2px;
  }

  .task-card.p-high::before { background: var(--red); }
  .task-card.p-medium::before { background: var(--yellow); }
  .task-card.p-low::before { background: var(--green); }

  .check {
    width: 18px; height: 18px;
    border: 1.5px solid var(--border2);
    border-radius: 5px;
    flex-shrink: 0;
    cursor: pointer;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-size: 0.65rem;
  }

  .check:hover { border-color: var(--green); }
  .task-card.done .check { background: var(--green); border-color: var(--green); color: #000; font-weight: 700; }

  .task-content { flex: 1; min-width: 0; }

  .task-title {
    font-size: 0.88rem;
    font-weight: 500;
    line-height: 1.3;
    margin-bottom: 4px;
    word-break: break-word;
  }

  .task-card.done .task-title { text-decoration: line-through; color: var(--text3); }

  .task-note {
    font-size: 0.75rem;
    color: var(--text3);
    margin-bottom: 5px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .task-chips {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    align-items: center;
  }

  .t-chip {
    font-size: 0.63rem;
    padding: 2px 7px;
    border-radius: 100px;
    border: 1px solid var(--border);
    color: var(--text3);
    font-weight: 500;
  }

  .t-chip.cat { border-color: #333; color: var(--text2); }
  .t-chip.due-ok { color: var(--text3); }
  .t-chip.due-soon { border-color: rgba(245,200,66,.4); color: var(--yellow); }
  .t-chip.due-urgent { border-color: rgba(255,68,68,.4); color: var(--red); }
  .t-chip.overdue { background: rgba(255,68,68,.08); border-color: rgba(255,68,68,.3); color: var(--red); font-weight: 600; }

  .task-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .task-card:hover .task-actions { opacity: 1; }

  .ta-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text3);
    cursor: pointer;
    padding: 3px 6px;
    font-size: 0.7rem;
    line-height: 1;
    transition: all 0.15s;
  }

  .ta-btn:hover { border-color: var(--red); color: var(--red); }
  .ta-btn.pin:hover { border-color: var(--yellow); color: var(--yellow); }
  .ta-btn.pinned { border-color: rgba(245,200,66,.4); color: var(--yellow); }
  .ta-btn.edit-btn:hover { border-color: var(--blue); color: var(--blue); }

  /* Progress bar */
  .progress-wrap {
    padding: 6px 14px 8px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }

  .progress-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--text3);
    margin-bottom: 5px;
    font-family: 'JetBrains Mono', monospace;
  }

  .progress-track {
    height: 3px;
    background: var(--bg3);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--white);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* Stats mini row */
  .stats-mini {
    display: flex;
    gap: 6px;
    padding: 0 14px 10px;
    flex-shrink: 0;
  }

  .stat-mini {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 6px;
    text-align: center;
  }

  .stat-mini-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    font-weight: 500;
    line-height: 1;
    margin-bottom: 2px;
  }

  .stat-mini-val.red { color: var(--red); }
  .stat-mini-val.yellow { color: var(--yellow); }
  .stat-mini-val.green { color: var(--green); }
  .stat-mini-val.white { color: var(--white); }

  .stat-mini-label { font-size: 0.58rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; }

  /* ——— FOCUS MODE view ——— */
  .focus-view {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px 16px;
    gap: 16px;
    overflow-y: auto;
  }

  .focus-header {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text3);
    text-align: center;
  }

  .focus-task {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
  }

  .focus-task-title {
    font-size: 1.1rem;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 8px;
  }

  .focus-task-meta { font-size: 0.78rem; color: var(--text3); margin-bottom: 16px; }

  .focus-done-btn {
    background: var(--white);
    border: none;
    border-radius: 7px;
    color: #000;
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    padding: 10px 24px;
    transition: opacity 0.15s;
  }

  .focus-done-btn:hover { opacity: 0.85; }

  .focus-empty { color: var(--text3); font-size: 0.85rem; text-align: center; padding: 40px 0; }

  /* Pomodoro timer */
  .pomo-ring {
    position: relative;
    width: 140px; height: 140px;
  }

  .pomo-ring svg { transform: rotate(-90deg); }
  .pomo-ring-bg { stroke: var(--bg3); stroke-width: 6; fill: none; }
  .pomo-ring-fill { stroke: var(--white); stroke-width: 6; fill: none; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }

  .pomo-time {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
  }

  .pomo-digits { font-size: 1.8rem; font-weight: 500; letter-spacing: -1px; line-height: 1; }
  .pomo-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); margin-top: 3px; }

  .pomo-controls { display: flex; gap: 8px; }

  .pomo-btn {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text2);
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 8px 16px;
    transition: all 0.15s;
  }

  .pomo-btn:hover { border-color: var(--border2); color: var(--white); }
  .pomo-btn.active { background: var(--white); border-color: var(--white); color: #000; }

  .pomo-mode-row { display: flex; gap: 6px; }

  .pomo-mode-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text3);
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    font-size: 0.7rem;
    padding: 4px 10px;
    transition: all 0.15s;
  }

  .pomo-mode-btn.active { background: var(--bg3); border-color: var(--border2); color: var(--text); }

  /* ——— ANALYTICS view ——— */
  .analytics-view {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
  }

  .analytics-section { margin-bottom: 20px; }

  .a-title {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text3);
    margin-bottom: 10px;
  }

  .bar-chart { display: flex; flex-direction: column; gap: 7px; }

  .bar-row { display: flex; align-items: center; gap: 10px; }

  .bar-label { font-size: 0.75rem; color: var(--text2); width: 70px; flex-shrink: 0; }

  .bar-track {
    flex: 1;
    height: 8px;
    background: var(--bg3);
    border-radius: 4px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 4px;
    background: var(--white);
    transition: width 0.6s ease;
  }

  .bar-count { font-size: 0.72rem; color: var(--text3); width: 20px; text-align: right; font-family: 'JetBrains Mono', monospace; }

  .streak-display {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
  }

  .streak-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2rem;
    font-weight: 500;
    color: var(--yellow);
    line-height: 1;
  }

  .streak-text { font-size: 0.8rem; color: var(--text2); line-height: 1.5; }
  .streak-sub { font-size: 0.7rem; color: var(--text3); }

  /* Toasts */
  .toast-container {
    position: fixed;
    bottom: 16px; right: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 9999;
    pointer-events: none;
  }

  .toast {
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 9px;
    padding: 10px 14px;
    font-size: 0.8rem;
    max-width: 260px;
    pointer-events: all;
    cursor: pointer;
    animation: toastIn 0.2s ease;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    line-height: 1.4;
  }

  .toast.urgent { border-color: rgba(255,68,68,.4); }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .toast-t { font-weight: 600; margin-bottom: 2px; }

  /* Edit modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 380px;
    animation: modalIn 0.2s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal-title { font-size: 0.92rem; font-weight: 600; margin-bottom: 14px; }

  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .modal-field { display: flex; flex-direction: column; gap: 4px; }
  .modal-field.full { grid-column: 1 / -1; }

  .modal-field label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); }

  .modal-field input,
  .modal-field select,
  .modal-field textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 0.82rem;
    padding: 8px 10px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }

  .modal-field input:focus,
  .modal-field select:focus { border-color: var(--border2); }

  .modal-field textarea { resize: none; height: 60px; }
  .modal-field select option { background: var(--bg); }

  .modal-actions { display: flex; gap: 8px; margin-top: 14px; }

  /* Scrollbar */
  .analytics-view::-webkit-scrollbar { width: 4px; }
  .analytics-view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Search box */
  .search-row {
    padding: 0 14px 8px;
    flex-shrink: 0;
  }

  .search-inner {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    transition: border-color 0.15s;
  }

  .search-inner:focus-within { border-color: var(--border2); }

  .search-icon { font-size: 0.75rem; color: var(--text3); flex-shrink: 0; }

  .search-inner input {
    background: none;
    border: none;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 0.82rem;
    outline: none;
    flex: 1;
  }

  .search-inner input::placeholder { color: var(--text3); }
</style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="logo">
      <div class="logo-dot"></div>
      TaskFlow
    </div>
    <div class="topbar-right">
      <span class="clock" id="clock">--:--</span>
      <button class="icon-btn" onclick="clearDone()" title="Clear done tasks">✕ done</button>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabbar">
    <button class="tab active" onclick="switchTab('tasks',this)">Tasks</button>
    <button class="tab" onclick="switchTab('focus',this)">Focus</button>
    <button class="tab" onclick="switchTab('analytics',this)">Insights</button>
  </div>

        <label>Title</label>

      </div>
      <div class="modal-field full">
        <label>Note</label>
        <textarea id="edit-desc"></textarea>
      </div>
      <div class="modal-field">
        <label>Deadline</label>
        <input type="datetime-local" id="edit-due">
      </div>
      <div class="modal-field">
        <label>Priority</label>
        <select id="edit-priority">
          <option value="medium">⚡ Medium</option>
          <option value="high">🔴 High</option>
          <option value="low">🟢 Low</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Category</label>
        <select id="edit-cat">
          <option value="work">💼 Work</option>
          <option value="personal">🏠 Personal</option>
          <option value="health">💪 Health</option>
          <option value="finance">💰 Finance</option>
          <option value="learning">📚 Learning</option>
          <option value="other">✨ Other</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Repeat</label>
        <select id="edit-repeat">
          <option value="none">None</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
        </select>
      </div>

      <button class="btn-primary" onclick="saveEdit()">Save Changes</button>
      <button class="btn-secondary" onclick="document.getElementById('modal-overlay').classList.remove('open')">Cancel</button>
    </div>

<script>
/* ========== STATE ========== */
const isExtension = typeof chrome !== 'undefined' && chrome.storage;
let tasks = [];
let filter = 'all';
let editingId = null;
let formOpen = false;

/* ========== STORAGE ========== */
function loadTasks(cb) {
  if (isExtension) {
    chrome.storage.local.get(['taskflow_tasks', 'taskflow_streak', 'taskflow_streak_date'], r => {
      tasks = r.taskflow_tasks || [];
      streak = r.taskflow_streak || 0;
      streakDate = r.taskflow_streak_date || '';
      cb();
    });
  } else {
    tasks = JSON.parse(localStorage.getItem('taskflow_tasks') || '[]');
    streak = parseInt(localStorage.getItem('taskflow_streak') || '0');
    streakDate = localStorage.getItem('taskflow_streak_date') || '';
    cb();
  }
}

function saveTasks() {
  if (isExtension) {
    chrome.storage.local.set({ taskflow_tasks: tasks, taskflow_streak: streak, taskflow_streak_date: streakDate });
  } else {
    localStorage.setItem('taskflow_tasks', JSON.stringify(tasks));
    localStorage.setItem('taskflow_streak', streak);
    localStorage.setItem('taskflow_streak_date', streakDate);
  }
}

/* ========== STREAK ========== */
let streak = 0;
let streakDate = '';

function updateStreak() {
  const today = new Date().toDateString();
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  const doneToday = tasks.some(t => t.done && t.doneAt && new Date(t.doneAt).toDateString() === today);
  if (!doneToday) return;
  if (streakDate === today) return;
  if (streakDate === yesterday) { streak++; } else { streak = 1; }
  streakDate = today;
  saveTasks();
}

/* ========== HELPERS ========== */
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function catLabel(c) { return { work:'💼 Work', personal:'🏠 Personal', health:'💪 Health', finance:'💰 Finance', learning:'📚 Learning', other:'✨ Other' }[c] || c; }

function countdown(due) {
  if (!due) return null;
  const diff = new Date(due) - Date.now();
  const abs = Math.abs(diff);
  const m = Math.floor(abs / 60000);
  const h = Math.floor(abs / 3600000);
  const d = Math.floor(abs / 86400000);
  let label, cls;
  if (diff < 0) { cls = 'overdue'; label = `overdue ${d > 0 ? d+'d ' : ''}${h%24}h ago`; }
  else if (diff < 3600000) { cls = 'due-urgent'; label = `${m}m left`; }
  else if (diff < 86400000) { cls = 'due-soon'; label = `${h}h left`; }
  else { cls = 'due-ok'; label = new Date(due).toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + new Date(due).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  return { label, cls };
}

function isToday(due) {
  if (!due) return false;
  const d = new Date(due), now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
}

function isOverdue(due) { return due && new Date(due) < Date.now(); }

/* ========== ADD TASK ========== */
function submitQuick() {
  const title = document.getElementById('inp-title').value.trim();
  if (!title) { flash(document.getElementById('inp-title')); return; }
  pushTask(title, '', '', 'medium', 'work', 'none');
  document.getElementById('inp-title').value = '';
}

function submitFull() {
  const title = document.getElementById('inp-title').value.trim();
  if (!title) { flash(document.getElementById('inp-title')); return; }
  pushTask(
    title,
    document.getElementById('inp-desc').value.trim(),
    document.getElementById('inp-due').value,
    document.getElementById('inp-priority').value,
    document.getElementById('inp-cat').value,
    document.getElementById('inp-repeat').value
  );
  document.getElementById('inp-title').value = '';
  document.getElementById('inp-desc').value = '';
  document.getElementById('inp-due').value = '';
  document.getElementById('expand-form').classList.remove('open');
  formOpen = false;
}

function pushTask(title, desc, due, priority, category, repeat) {
  tasks.unshift({ id: genId(), title, desc, due, priority, category, repeat: repeat || 'none', done: false, pinned: false, created: Date.now(), doneAt: null });
  saveTasks();
  render();
  showToast('Task added', title, false);
}

function flash(el) { el.style.outline = '2px solid #ff4444'; setTimeout(() => el.style.outline = '', 600); }

function toggleForm() {
  formOpen = !formOpen;
  document.getElementById('expand-form').classList.toggle('open', formOpen);
}

/* ========== ACTIONS ========== */
function toggleDone(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  t.done = !t.done;
  t.doneAt = t.done ? Date.now() : null;
  if (t.done) {
    updateStreak();
    // Handle recurring
    if (t.repeat && t.repeat !== 'none' && t.due) {
      const d = new Date(t.due);
      if (t.repeat === 'daily') d.setDate(d.getDate() + 1);
      else if (t.repeat === 'weekly') d.setDate(d.getDate() + 7);
      else if (t.repeat === 'monthly') d.setMonth(d.getMonth() + 1);
      tasks.unshift({ ...t, id: genId(), done: false, doneAt: null, due: d.toISOString().slice(0,16), created: Date.now() });
    }
  }
  saveTasks(); render();
}

function deleteTask(id) { tasks = tasks.filter(t => t.id !== id); saveTasks(); render(); }
function togglePin(id) { const t = tasks.find(t => t.id === id); if (t) { t.pinned = !t.pinned; saveTasks(); render(); } }
function clearDone() { tasks = tasks.filter(t => !t.done); saveTasks(); render(); showToast('Cleared', 'Done tasks removed', false); }

/* ========== EDIT ========== */
function openEdit(id) {
  editingId = id;
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  document.getElementById('edit-title').value = t.title;
  document.getElementById('edit-desc').value = t.desc || '';
  document.getElementById('edit-due').value = t.due || '';
  document.getElementById('edit-priority').value = t.priority;
  document.getElementById('edit-cat').value = t.category;
  document.getElementById('edit-repeat').value = t.repeat || 'none';
  document.getElementById('modal-overlay').classList.add('open');
}

function saveEdit() {
  const t = tasks.find(t => t.id === editingId);
  if (!t) return;
  t.title = document.getElementById('edit-title').value.trim() || t.title;
  t.desc = document.getElementById('edit-desc').value.trim();
  t.due = document.getElementById('edit-due').value;
  t.priority = document.getElementById('edit-priority').value;
  t.category = document.getElementById('edit-cat').value;
  t.repeat = document.getElementById('edit-repeat').value;
  saveTasks(); render();
  document.getElementById('modal-overlay').classList.remove('open');
  showToast('Updated', t.title, false);
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}

/* ========== FILTER / SORT ========== */
function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function getFiltered() {
  const q = (document.getElementById('search')?.value || '').toLowerCase();
  return tasks
    .filter(t => {
      if (q && !t.title.toLowerCase().includes(q) && !(t.desc||'').toLowerCase().includes(q)) return false;
      if (filter === 'active') return !t.done;
      if (filter === 'done') return t.done;
      if (filter === 'high') return t.priority === 'high' && !t.done;
      if (filter === 'today') return isToday(t.due) && !t.done;
      if (filter === 'overdue') return isOverdue(t.due) && !t.done;
      if (filter === 'pinned') return t.pinned;
      return true;
    })
    .sort((a, b) => {
      if (a.pinned !== b.pinned) return b.pinned - a.pinned;
      if (!a.done && b.done) return -1;
      if (a.done && !b.done) return 1;
      const po = { high: 0, medium: 1, low: 2 };
      if (po[a.priority] !== po[b.priority]) return po[a.priority] - po[b.priority];
      return b.created - a.created;
    });
}

/* ========== RENDER ========== */
function render() {
  const list = getFiltered();
  const el = document.getElementById('task-list');
  const now = new Date();

  // Stats
  const total = tasks.filter(t => !t.done).length;
  const done = tasks.filter(t => t.done).length;
  const urgent = tasks.filter(t => t.priority === 'high' && !t.done).length;
  const todayN = tasks.filter(t => isToday(t.due) && !t.done).length;

  document.getElementById('s-total').textContent = total;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-urgent').textContent = urgent;
  document.getElementById('s-today').textContent = todayN;

  const allN = tasks.length;
  const pct = allN ? Math.round((done / allN) * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${done} / ${allN} done`;
  document.getElementById('prog-pct').textContent = pct + '%';

  // Focus task
  const nextTask = tasks.filter(t => !t.done).sort((a, b) => {
    const po = { high: 0, medium: 1, low: 2 };
    if (po[a.priority] !== po[b.priority]) return po[a.priority] - po[b.priority];
    if (a.due && b.due) return new Date(a.due) - new Date(b.due);
    if (a.due) return -1;
    if (b.due) return 1;
    return 0;
  })[0];

  const fa = document.getElementById('focus-task-area');
  if (nextTask) {
    const cd = countdown(nextTask.due);
    fa.innerHTML = `
      <div class="focus-task">
        <div style="font-size:.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:8px;">Next Priority</div>
        <div class="focus-task-title">${esc(nextTask.title)}</div>
        ${nextTask.desc ? `<div class="focus-task-meta">${esc(nextTask.desc)}</div>` : ''}
        ${cd ? `<div class="focus-task-meta"><span class="t-chip ${cd.cls}">${cd.label}</span></div>` : ''}
        <button class="focus-done-btn" onclick="toggleDone('${nextTask.id}')">✓ Mark Done</button>
      </div>`;
  } else {
    fa.innerHTML = `<div class="focus-empty">🎉 All tasks complete!</div>`;
  }

  // Analytics
  renderAnalytics();

  // Tasks
  if (!list.length) {
    el.innerHTML = `<div class="empty"><span class="e-icon">📋</span>Nothing here.<br>Add a task above to get started.</div>`;
    return;
  }

  el.innerHTML = list.map(t => {
    const cd = countdown(t.due);
    const repeatIcon = t.repeat && t.repeat !== 'none' ? `<span class="t-chip">↻ ${t.repeat}</span>` : '';
    return `
    <div class="task-card p-${t.priority} ${t.done ? 'done' : ''}">
      <div class="check" onclick="toggleDone('${t.id}')">${t.done ? '✓' : ''}</div>
      <div class="task-content">
        <div class="task-title">${esc(t.title)}</div>
        ${t.desc ? `<div class="task-note">${esc(t.desc)}</div>` : ''}
        <div class="task-chips">
          <span class="t-chip cat">${catLabel(t.category)}</span>
          ${cd ? `<span class="t-chip ${cd.cls}">${cd.label}</span>` : ''}
          ${repeatIcon}
          ${t.pinned ? '<span class="t-chip" style="color:var(--yellow);border-color:rgba(245,200,66,.3)">📌</span>' : ''}
        </div>
      </div>
      <div class="task-actions">
        <button class="ta-btn edit-btn" onclick="openEdit('${t.id}')" title="Edit">✎</button>
        <button class="ta-btn pin ${t.pinned ? 'pinned' : ''}" onclick="togglePin('${t.id}')" title="Pin">📌</button>
        <button class="ta-btn" onclick="deleteTask('${t.id}')" title="Delete">✕</button>
      </div>
    </div>`;
  }).join('');
}

function renderAnalytics() {
  // Streak
  document.getElementById('streak-num').textContent = streak;
  document.getElementById('streak-sub').textContent = streak > 1 ? `${streak} days in a row!` : 'Complete a task today to start!';

  // By category
  const cats = ['work','personal','health','finance','learning','other'];
  const catEmoji = { work:'💼', personal:'🏠', health:'💪', finance:'💰', learning:'📚', other:'✨' };
  const catCounts = {};
  cats.forEach(c => { catCounts[c] = tasks.filter(t => t.category === c).length; });
  const maxCat = Math.max(1, ...Object.values(catCounts));

  document.getElementById('cat-chart').innerHTML = cats
    .filter(c => catCounts[c] > 0)
    .map(c => `
    <div class="bar-row">
      <div class="bar-label">${catEmoji[c]} ${c}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(catCounts[c]/maxCat*100)}%"></div></div>
      <div class="bar-count">${catCounts[c]}</div>
    </div>`).join('') || '<div style="font-size:.75rem;color:var(--text3)">No data yet</div>';

  // By priority
  const pris = [['high','🔴 High'], ['medium','⚡ Medium'], ['low','🟢 Low']];
  const priCounts = {};
  pris.forEach(([p]) => { priCounts[p] = tasks.filter(t => t.priority === p).length; });
  const maxPri = Math.max(1, ...Object.values(priCounts));

  document.getElementById('pri-chart').innerHTML = pris
    .filter(([p]) => priCounts[p] > 0)
    .map(([p, label]) => `
    <div class="bar-row">
      <div class="bar-label">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(priCounts[p]/maxPri*100)}%"></div></div>
      <div class="bar-count">${priCounts[p]}</div>
    </div>`).join('') || '<div style="font-size:.75rem;color:var(--text3)">No data yet</div>';

  // Completion
  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const active = total - done;
  document.getElementById('comp-chart').innerHTML = `
    <div class="bar-row">
      <div class="bar-label">✓ Done</div>
      <div class="bar-track"><div class="bar-fill" style="width:${total ? done/total*100 : 0}%"></div></div>
      <div class="bar-count">${done}</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">○ Active</div>
      <div class="bar-track"><div class="bar-fill" style="width:${total ? active/total*100 : 0}%;opacity:.4"></div></div>
      <div class="bar-count">${active}</div>
    </div>`;
}

/* ========== CLOCK ========== */
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
setInterval(updateClock, 1000);
updateClock();

/* ========== COUNTDOWN TICKER ========== */
setInterval(render, 60000);

/* ========== IN-PAGE REMINDERS ========== */
let notified = new Set(JSON.parse(localStorage.getItem('tf_notified') || '[]'));

function checkReminders() {
  const now = Date.now();
  tasks.forEach(t => {
    if (t.done || !t.due) return;
    const diff = new Date(t.due) - now;
    const k30 = t.id+'_30', k10 = t.id+'_10', kov = t.id+'_ov';
    if (diff > 0 && diff <= 30*60000 && !notified.has(k30)) {
      notified.add(k30); saveNotified();
      showToast('⏰ 30 min left!', t.title, true);
    }
    if (diff > 0 && diff <= 10*60000 && !notified.has(k10)) {
      notified.add(k10); saveNotified();
      showToast('🚨 10 min left!', t.title, true);
    }
    if (diff <= 0 && diff > -120000 && !notified.has(kov)) {
      notified.add(kov); saveNotified();
      showToast('❗ Task overdue!', t.title, true);
    }
  });
}

function saveNotified() { localStorage.setItem('tf_notified', JSON.stringify([...notified])); }
setInterval(checkReminders, 30000);

/* ========== TOASTS ========== */
function showToast(title, msg, urgent) {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast' + (urgent ? ' urgent' : '');
  el.innerHTML = `<div class="toast-t">${title}</div>${msg}`;
  el.onclick = () => el.remove();
  c.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

/* ========== TABS ========== */
function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view-' + name).classList.add('active');
  if (name === 'analytics') renderAnalytics();
}

/* ========== POMODORO ========== */
let pomoTotal = 25 * 60;
let pomoLeft = pomoTotal;
let pomoRunning = false;
let pomoTimer = null;
const CIRCUM = 2 * Math.PI * 62;

function setPomoMode(mins, label, btn) {
  clearInterval(pomoTimer);
  pomoRunning = false;
  document.getElementById('pomo-start-btn').textContent = '▶ Start';
  document.getElementById('pomo-start-btn').classList.add('active');
  document.querySelectorAll('.pomo-mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  pomoTotal = mins * 60;
  pomoLeft = pomoTotal;
  document.getElementById('pomo-label').textContent = label;
  updatePomoDisplay();
}

function togglePomo() {
  pomoRunning = !pomoRunning;
  const btn = document.getElementById('pomo-start-btn');
  if (pomoRunning) {
    btn.textContent = '⏸ Pause';
    btn.classList.remove('active');
    pomoTimer = setInterval(() => {
      pomoLeft--;
      updatePomoDisplay();
      if (pomoLeft <= 0) {
        clearInterval(pomoTimer);
        pomoRunning = false;
        btn.textContent = '▶ Start';
        btn.classList.add('active');
        showToast('⏰ Timer done!', 'Great focus session!', false);
      }
    }, 1000);
  } else {
    clearInterval(pomoTimer);
    btn.textContent = '▶ Start';
    btn.classList.add('active');
  }
}

function resetPomo() {
  clearInterval(pomoTimer);
  pomoRunning = false;
  pomoLeft = pomoTotal;
  document.getElementById('pomo-start-btn').textContent = '▶ Start';
  document.getElementById('pomo-start-btn').classList.add('active');
  updatePomoDisplay();
}

function updatePomoDisplay() {
  const m = String(Math.floor(pomoLeft / 60)).padStart(2, '0');
  const s = String(pomoLeft % 60).padStart(2, '0');
  document.getElementById('pomo-digits').textContent = `${m}:${s}`;
  const offset = CIRCUM * (1 - pomoLeft / pomoTotal);
  document.getElementById('pomo-circle').style.strokeDashoffset = offset;
}

updatePomoDisplay();

/* ========== INIT ========== */
loadTasks(() => { render(); checkReminders(); });

document.getElementById('inp-title').addEventListener('keydown', e => { if (e.key === 'Enter') submitQuick(); });
</script>
